[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundesliga-research"
version = "0.1.0"
description = "Independent Bundesliga research, evidence audits and upset screening"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bundesliga = "bundesliga.cli:main"

[tool.setuptools.packages.find]
include = ["bundesliga*"]
