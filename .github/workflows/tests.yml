name: Bundesliga verification
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m bundesliga --db work/ci.sqlite import-history data/processed/matches.jsonl
      - run: python -m bundesliga --db work/ci.sqlite audit
